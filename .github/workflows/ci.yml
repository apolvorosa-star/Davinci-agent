name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install linters
        run: pip install --upgrade pip && pip install ruff black
      - name: Ruff
        run: ruff check . --output-format=github
      - name: Black (format check)
        run: black --check .

  tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Solo las deps que necesitan los tests unitarios (providers, config).
      # torch/whisper quedan fuera: los tests de IA se auto-skipean sin ellas.
      - name: Install test dependencies
        run: pip install requests pyyaml python-dotenv pytest
      - name: Run tests
        run: pytest tests/
